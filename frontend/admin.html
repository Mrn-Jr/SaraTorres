<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Estética</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #09090b;
            background-image: radial-gradient(circle at 15% 50%, rgba(202, 138, 4, 0.05), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(202, 138, 4, 0.05), transparent 25%);
        }
    </style>
</head>
<body class="text-gray-200 min-h-screen p-4 md:p-8 font-sans">
    
   <div class="max-w-xl mx-auto space-y-6">
        <header class="bg-zinc-950/80 border border-zinc-800 rounded-xl p-5 flex justify-between items-center shadow-lg backdrop-blur-sm">
            <h1 class="text-2xl font-black text-yellow-500 tracking-wide drop-shadow-md">Painel de Gestão</h1>
            
            <a href="agenda.html" class="text-zinc-400 hover:text-white text-sm font-medium transition-colors cursor-pointer">
                Voltar
            </a>
        </header>


        <!-- Bloquear Horário Manual -->
        <div class="bg-zinc-900/90 border border-zinc-800 rounded-xl p-5 shadow-md mt-8">
            <h2 class="text-xl font-bold text-yellow-500 mb-1">Bloquear Horário (Imprevistos)</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 mt-4">
                <div>
                    <label class="block text-zinc-300 text-xs mb-1">Data</label>
                    <input type="date" id="data_bloqueio" class="w-full bg-black border border-zinc-800 rounded-lg p-2.5 text-zinc-300 focus:outline-none focus:border-yellow-600">
                </div>
                <div>
                    <label class="block text-zinc-300 text-xs mb-1">Início</label>
                    <input type="time" id="inicio_bloqueio" class="w-full bg-black border border-zinc-800 rounded-lg p-2.5 text-zinc-300 focus:outline-none focus:border-yellow-600">
                </div>
                <div>
                    <label class="block text-zinc-300 text-xs mb-1">Fim</label>
                    <input type="time" id="fim_bloqueio" class="w-full bg-black border border-zinc-800 rounded-lg p-2.5 text-zinc-300 focus:outline-none focus:border-yellow-600">
                </div>
            </div>
            <button id="btn_bloquear" class="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-3 rounded-lg transition-colors shadow-md">Aplicar Bloqueio</button>
        </div>

        <!-- Secção: Configurar Horários da Semana -->
        <div class="bg-zinc-900/90 border border-zinc-800 rounded-xl p-5 shadow-md mt-8">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <h2 class="text-xl font-bold text-yellow-500 mb-1">Horários de Atendimento</h2>
                    <p class="text-zinc-400 text-sm">Marque os dias de trabalho e ajuste o horário de cada dia (ex: Sábado com horário diferente).</p>
                </div>
            </div>

            <!-- Botão rápido para facilitar a vida da sua tia -->
            <div class="mt-3 mb-4">
                <button type="button" onclick="preencherSegundaSexta()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-yellow-500 border border-zinc-700 px-3 py-1.5 rounded-lg transition-colors">
                    ⚡ Copiar horário de Segunda para Terça a Sexta
                </button>
            </div>
            
            <!-- Lista com os 7 Dias da Semana -->
            <div id="grade-dias-semana" class="space-y-3">
                <!-- Injetado dinamicamente pelo JavaScript -->
            </div>

            <button onclick="salvarConfiguracoes()" class="w-full bg-yellow-600 hover:bg-yellow-500 text-white font-bold py-3.5 rounded-lg transition-colors shadow-md mt-5">
                Salvar Todos os Horários
            </button>
        </div>
            
        <!-- Gestão de Serviços -->
        <div class="bg-zinc-900/90 border border-zinc-800 rounded-xl p-5 shadow-md flex justify-between items-center mt-8">
            <h2 class="text-xl font-bold text-white">Serviços</h2>
            <button onclick="abrirModalServico()" class="text-yellow-500 font-semibold hover:text-yellow-400">+ Novo</button>
        </div>
        <div id="lista-servicos" class="space-y-3 mb-10"></div>
    </div>

    <!-- Modal de Serviço (Escondido) -->
    <div id="modal-servico" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex justify-center items-center z-50">
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 w-11/12 max-w-md shadow-2xl">
            <h2 id="modal-titulo" class="text-xl font-bold text-yellow-500 mb-4">Novo Serviço</h2>
            <input type="hidden" id="servico_id">
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-zinc-300 text-xs mb-1">Nome do Serviço</label>
                    <input type="text" id="servico_nome" class="w-full bg-black border border-zinc-800 rounded-lg p-2.5 text-zinc-300 focus:outline-none focus:border-yellow-600">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-zinc-300 text-xs mb-1">Duração (minutos)</label>
                        <input type="number" id="servico_duracao" class="w-full bg-black border border-zinc-800 rounded-lg p-2.5 text-zinc-300 focus:outline-none focus:border-yellow-600">
                    </div>
                    <div>
                        <label class="block text-zinc-300 text-xs mb-1">Preço (R$)</label>
                        <input type="number" step="0.5" id="servico_preco" class="w-full bg-black border border-zinc-800 rounded-lg p-2.5 text-zinc-300 focus:outline-none focus:border-yellow-600">
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-3">
                <button onclick="fecharModalServico()" class="text-zinc-400 hover:text-white px-4 py-2 font-medium">Cancelar</button>
                <button id="btn_salvar_servico" class="bg-yellow-600 hover:bg-yellow-500 text-white font-bold px-6 py-2 rounded-lg transition-colors shadow-md">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            carregarAgenda();
            carregarServicos();
            carregarConfiguracoes(); // Carrega os horários salvos ao abrir o painel

            // Bloquear Horário Manual
            document.getElementById('btn_bloquear').addEventListener('click', () => {
                const dataVal = document.getElementById('data_bloqueio').value;
                const inicioVal = document.getElementById('inicio_bloqueio').value;
                const fimVal = document.getElementById('fim_bloqueio').value;
                if(!dataVal || !inicioVal || !fimVal) return alert('Preencha todos os campos do bloqueio.');

                fetch('https://mrnjr.pythonanywhere.com/api/admin/bloquear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: dataVal, hora_inicio: inicioVal, hora_fim: fimVal })
                }).then(() => window.location.reload());
            });

            // Salvar Serviço
            document.getElementById('btn_salvar_servico').addEventListener('click', () => {
                const id = document.getElementById('servico_id').value;
                const nome = document.getElementById('servico_nome').value;
                const duracao = document.getElementById('servico_duracao').value;
                const preco = document.getElementById('servico_preco').value;

                if(!nome || !duracao || !preco) return alert('Preencha todos os campos do serviço.');

                const url = id ? `https://mrnjr.pythonanywhere.com/api/admin/servicos/${id}` : 'https://mrnjr.pythonanywhere.com/api/admin/servicos';
                const method = id ? 'PUT' : 'POST';

                fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, duracao: parseInt(duracao), preco: parseFloat(preco) })
                }).then(() => {
                    fecharModalServico();
                    carregarServicos();
                });
            });
        });

        // URL da API (funciona no PC local e na nuvem PythonAnywhere)
        const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:')
            ? 'http://127.0.0.1:5000'
            : 'https://mrnjr.pythonanywhere.com';

        // Definição dos 7 dias da semana (0=Domingo, 1=Segunda ... 6=Sábado)
        const DIAS_SEMANA = [
            { id: 1, nome: "Segunda-feira" },
            { id: 2, nome: "Terça-feira" },
            { id: 3, nome: "Quarta-feira" },
            { id: 4, nome: "Quinta-feira" },
            { id: 5, nome: "Sexta-feira" },
            { id: 6, nome: "Sábado" },
            { id: 0, nome: "Domingo" }
        ];

        // 1. Desenha os 7 cartões com checkboxes na tela
        function renderizarEstruturaDias() {
            const container = document.getElementById('grade-dias-semana');
            if (!container) return;
            container.innerHTML = '';

            DIAS_SEMANA.forEach(dia => {
                container.innerHTML += `
                    <div class="bg-black border border-zinc-800 rounded-lg p-3 transition-all" id="card_dia_${dia.id}">
                        <div class="flex items-center justify-between">
                            <label class="flex items-center gap-3 cursor-pointer">
                                <input type="checkbox" id="check_dia_${dia.id}" onchange="toggleDia(${dia.id})" class="w-4 h-4 accent-yellow-500 rounded cursor-pointer">
                                <span class="font-bold text-white text-sm md:text-base">${dia.nome}</span>
                            </label>
                            <span id="badge_dia_${dia.id}" class="text-xs text-zinc-500 font-medium">Folga (Fechado)</span>
                        </div>

                        <div id="corpo_dia_${dia.id}" class="hidden mt-3 pt-3 border-t border-zinc-900 space-y-3">
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-zinc-400 text-xs mb-1">Abertura</label>
                                    <input type="time" id="abertura_${dia.id}" value="09:00" class="w-full bg-zinc-900 border border-zinc-700 rounded p-2 text-zinc-200 text-sm focus:outline-none focus:border-yellow-600">
                                </div>
                                <div>
                                    <label class="block text-zinc-400 text-xs mb-1">Fecho</label>
                                    <input type="time" id="fecho_${dia.id}" value="${dia.id === 6 ? '13:00' : '18:00'}" class="w-full bg-zinc-900 border border-zinc-700 rounded p-2 text-zinc-200 text-sm focus:outline-none focus:border-yellow-600">
                                </div>
                            </div>

                            <div class="bg-zinc-950/70 p-2.5 rounded border border-zinc-800/80">
                                <label class="flex items-center gap-2 cursor-pointer mb-2">
                                    <input type="checkbox" id="check_almoco_${dia.id}" onchange="toggleAlmoco(${dia.id})" class="w-3.5 h-3.5 accent-yellow-500 rounded">
                                    <span class="text-xs text-zinc-300 font-medium">Pausa de Almoço</span>
                                </label>
                                <div id="campos_almoco_${dia.id}" class="grid grid-cols-2 gap-3 hidden">
                                    <div>
                                        <label class="block text-zinc-500 text-[10px] mb-1">Início Almoço</label>
                                        <input type="time" id="almoco_inicio_${dia.id}" value="13:00" class="w-full bg-zinc-900 border border-zinc-700 rounded p-1.5 text-zinc-200 text-xs">
                                    </div>
                                    <div>
                                        <label class="block text-zinc-500 text-[10px] mb-1">Fim Almoço</label>
                                        <input type="time" id="almoco_fim_${dia.id}" value="14:00" class="w-full bg-zinc-900 border border-zinc-700 rounded p-1.5 text-zinc-200 text-xs">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // 2. Abre ou fecha os horários do dia
        function toggleDia(id) {
            const check = document.getElementById(`check_dia_${id}`);
            const corpo = document.getElementById(`corpo_dia_${id}`);
            const badge = document.getElementById(`badge_dia_${id}`);

            if (check.checked) {
                corpo.classList.remove('hidden');
                badge.innerText = 'Ativo';
                badge.className = 'text-xs text-yellow-500 font-semibold';
            } else {
                corpo.classList.add('hidden');
                badge.innerText = 'Folga (Fechado)';
                badge.className = 'text-xs text-zinc-500 font-medium';
            }
        }

        // 3. Abre ou fecha os campos de almoço
        function toggleAlmoco(id) {
            const check = document.getElementById(`check_almoco_${id}`);
            const campos = document.getElementById(`campos_almoco_${id}`);
            if (check.checked) {
                campos.classList.remove('hidden');
            } else {
                campos.classList.add('hidden');
            }
        }

        // 4. Carrega os horários guardados no banco SQLite
        function carregarConfiguracoes() {
            renderizarEstruturaDias();

            fetch(`${API_BASE}/api/admin/disponibilidade`)
                .then(r => r.json())
                .then(data => {
                    if (!data.regras || data.regras.length === 0) return;

                    data.regras.forEach(regra => {
                        const diaId = regra.dia_semana;
                        const checkDia = document.getElementById(`check_dia_${diaId}`);
                        if (!checkDia) return;

                        if (regra.tipo_regra === 'trabalho') {
                            checkDia.checked = true;
                            toggleDia(diaId);
                            document.getElementById(`abertura_${diaId}`).value = regra.hora_inicio;
                            document.getElementById(`fecho_${diaId}`).value = regra.hora_fim;
                        } else if (regra.tipo_regra === 'bloqueio') {
                            const checkAlmoco = document.getElementById(`check_almoco_${diaId}`);
                            if (checkAlmoco) {
                                checkAlmoco.checked = true;
                                toggleAlmoco(diaId);
                                document.getElementById(`almoco_inicio_${diaId}`).value = regra.hora_inicio;
                                document.getElementById(`almoco_fim_${diaId}`).value = regra.hora_fim;
                            }
                        }
                    });
                })
                .catch(err => console.error("Erro ao carregar disponibilidade:", err));
        }

        // 5. Botão de atalho: copia a Segunda para Terça, Quarta, Quinta e Sexta
        function preencherSegundaSexta() {
            const segAbertura = document.getElementById('abertura_1').value;
            const segFecho = document.getElementById('fecho_1').value;
            const segTemAlmoco = document.getElementById('check_almoco_1').checked;
            const segAlmocoInicio = document.getElementById('almoco_inicio_1').value;
            const segAlmocoFim = document.getElementById('almoco_fim_1').value;

            [2-5].forEach(id => {
                document.getElementById(`check_dia_${id}`).checked = true;
                toggleDia(id);
                document.getElementById(`abertura_${id}`).value = segAbertura;
                document.getElementById(`fecho_${id}`).value = segFecho;
                
                const almocoCheck = document.getElementById(`check_almoco_${id}`);
                almocoCheck.checked = segTemAlmoco;
                toggleAlmoco(id);
                document.getElementById(`almoco_inicio_${id}`).value = segAlmocoInicio;
                document.getElementById(`almoco_fim_${id}`).value = segAlmocoFim;
            });

            alert('Horário de Segunda-feira copiado para Terça a Sexta!');
        }

        // 6. Envia a lista com os horários de cada dia para o Python
        function salvarConfiguracoes() {
            const diasConfigurados = [];

            DIAS_SEMANA.forEach(dia => {
                const check = document.getElementById(`check_dia_${dia.id}`);
                if (check && check.checked) {
                    const abertura = document.getElementById(`abertura_${dia.id}`).value;
                    const fecho = document.getElementById(`fecho_${dia.id}`).value;
                    const temAlmoco = document.getElementById(`check_almoco_${dia.id}`).checked;
                    const almocoInicio = document.getElementById(`almoco_inicio_${dia.id}`).value;
                    const almocoFim = document.getElementById(`almoco_fim_${dia.id}`).value;

                    diasConfigurados.push({
                        dia_semana: dia.id,
                        abertura: abertura,
                        fecho: fecho,
                        tem_almoco: temAlmoco,
                        almoco_inicio: temAlmoco ? almocoInicio : null,
                        almoco_fim: temAlmoco ? almocoFim : null
                    });
                }
            });

            if (diasConfigurados.length === 0) {
                return alert("Por favor, selecione pelo menos um dia de trabalho.");
            }

            fetch(`${API_BASE}/api/admin/disponibilidade`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dias: diasConfigurados })
            })
            .then(r => r.json())
            .then(data => {
                alert(data.mensagem || "Horários guardados com sucesso!");
            })
            .catch(err => {
                console.error("Erro ao salvar:", err);
                alert("Ocorreu um erro ao salvar os horários.");
            });
        }

 function carregarAgenda() {
            fetch('https://mrnjr.pythonanywhere.com/api/admin/agendamentos')
                .then(r => r.json())
                .then(data => {
                    const lista = document.getElementById('lista-agendamentos');
                    lista.innerHTML = ''; 
                    if (data.agendamentos.length === 0) {
                        lista.innerHTML = `<div class="bg-zinc-900/90 border border-zinc-800 rounded-xl p-5 text-center"><p class="text-zinc-400 italic">Agenda livre.</p></div>`;
                        return;
                    }
                    data.agendamentos.forEach(ag => {
                        const hInicio = new Date(ag.data_hora_inicio).toLocaleTimeString('pt-PT', {hour: '2-digit', minute:'2-digit'});
                        const hFim = new Date(ag.data_hora_fim).toLocaleTimeString('pt-PT', {hour: '2-digit', minute:'2-digit'});
                        const dt = new Date(ag.data_hora_inicio).toLocaleDateString('pt-PT');
                        const corStatus = ag.status === 'confirmado' ? 'text-yellow-500' : (ag.status === 'bloqueado' ? 'text-red-500' : 'text-zinc-500');

                        // Organiza o rodapé do cartão (WhatsApp de um lado, Excluir do outro)
                        let rodapeHtml = `<div class="mt-4 pt-3 border-t border-zinc-800/50 flex justify-between items-center">`;
                        
                        if (ag.telefone_whatsapp) {
                            let num = ag.telefone_whatsapp.replace(/\D/g, '');
                            if (num.length >= 10) num = '55' + num; else if (num.length === 9) num = '351' + num;
                            rodapeHtml += `<a href="https://wa.me/${num}" target="_blank" class="text-sm font-medium text-green-500 hover:text-green-400">Falar no WhatsApp</a>`;
                        } else {
                            rodapeHtml += `<span></span>`; // Espaço vazio para manter o botão excluir à direita caso seja um bloqueio
                        }

                        // Adiciona o botão de excluir
                        rodapeHtml += `<button onclick="excluirAgendamento(${ag.id_agendamento})" class="text-red-500 hover:text-red-400 text-sm font-medium transition-colors">Excluir</button></div>`;

                        lista.innerHTML += `
                            <div class="bg-zinc-900/90 border border-zinc-800 rounded-xl p-5 shadow-md">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="text-xl font-bold text-white">${hInicio} - ${hFim}</h3>
                                    <span class="${corStatus} text-sm font-semibold capitalize">${ag.status}</span>
                                </div>
                                <p class="text-zinc-300">Cliente/Evento: <span class="text-white font-medium">${ag.nome}</span></p>
                                <p class="text-zinc-500 text-sm mt-0.5">${ag.nome_servico} | Data: ${dt}</p>
                                ${rodapeHtml}
                            </div>`;
                    });
                });
        }

        function excluirAgendamento(id) {
            if(confirm("Tem certeza que deseja apagar este registo da agenda? O horário voltará a ficar livre para marcações.")) {
                fetch(`https://mrnjr.pythonanywhere.com/api/admin/agendamentos/${id}`, { 
                    method: 'DELETE' 
                })
                .then(r => r.json())
                .then(data => { 
                    alert(data.mensagem); 
                    carregarAgenda(); // Atualiza a agenda instantaneamente
                })
                .catch(err => console.error("Erro ao excluir:", err));
            }
        }

        function carregarServicos() {
            fetch('https://mrnjr.pythonanywhere.com/api/servicos')
                .then(r => r.json())
                .then(data => {
                    const lista = document.getElementById('lista-servicos');
                    lista.innerHTML = '';
                    data.servicos.forEach(s => {
                        lista.innerHTML += `
                            <div class="bg-zinc-900/90 border border-zinc-800 rounded-xl p-5 shadow-md flex justify-between items-center">
                                <div>
                                    <h3 class="text-lg font-bold text-white">${s.nome_servico}</h3>
                                    <p class="text-zinc-500 text-sm mt-0.5">${s.duracao_minutos} min &bull; R$${s.preco}</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="abrirModalServico(${s.id_servico}, '${s.nome_servico}', ${s.duracao_minutos}, ${s.preco})" class="border border-zinc-700 text-zinc-300 px-4 py-1.5 rounded-lg text-sm hover:bg-zinc-800 transition-colors">
                                        Editar
                                    </button>
                                    <button onclick="excluirServico(${s.id_servico})" class="border border-red-900 text-red-500 px-4 py-1.5 rounded-lg text-sm hover:bg-red-950 transition-colors">
                                        Excluir
                                    </button>
                                </div>
                            </div>`;
                    });
                });
        }

        function excluirServico(id) {
            if(confirm("Tem certeza que deseja excluir este serviço do seu catálogo?")) {
                fetch(`https://mrnjr.pythonanywhere.com/api/admin/servicos/${id}`, { method: 'DELETE' })
                .then(r => r.json())
                .then(data => { alert(data.mensagem); carregarServicos(); })
            }
        }

        function abrirModalServico(id = '', nome = '', duracao = '', preco = '') {
            document.getElementById('modal-titulo').innerText = id ? 'Editar Serviço' : 'Novo Serviço';
            document.getElementById('servico_id').value = id;
            document.getElementById('servico_nome').value = nome;
            document.getElementById('servico_duracao').value = duracao;
            document.getElementById('servico_preco').value = preco;
            document.getElementById('modal-servico').classList.remove('hidden');
        }

        function fecharModalServico() {
            document.getElementById('modal-servico').classList.add('hidden');
        }
    </script>
</body>
</html>
